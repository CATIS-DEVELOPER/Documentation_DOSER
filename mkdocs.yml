site_name: "Documentation DOSER"
site_url: https://documentation-doser.readthedocs.io/
site_description: Documentation complète du système unifié de gestion des accidents de la route au Cameroun

theme:
  name: material
  custom_dir: docs/overrides
  language: fr
  logo: assets/logo.png
  favicon: assets/favicon.ico
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  
  palette:
    - scheme: default
      primary: blue
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Mode sombre
    - scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-night
        name: Mode clair

language: 'fr'
font: false
filter:
    versions:
      - 'master'
      - '2.42'
      - '2.41'
      - '2.40'
      - '2.39'
    categories:
      - Développement & Technique
     
nav:
  - 🏠 Accueil: index.md
  
  - 📚 Guides Rapides:
      - user/quick-start/index.md
      - Démarrage Rapide:
          - Agents Constatateurs: user/quick-start/agents-constatateurs.md
          - Services de Santé: user/quick-start/services-sante.md
          - Compagnies d'Assurance: user/quick-start/compagnies-assurance.md
          - Agents de Validation: user/quick-start/agents-validation.md
          - Administrateurs: user/quick-start/administrateurs.md
          - Usagers (Grand Public): user/quick-start/usagers.md
          - Morgue: user/quick-start/morgue.md
          - Services de Secours: user/quick-start/services-secours.md
          - Centre d'Analyse: user/quick-start/centre-analyse.md
          - Agences de Voyage: user/quick-start/agence-voyage.md
  
  - 📕 Manuels de Référence:
      - manuel/index.md
      - Par Rôle:
          - Agents Constatateurs: manuel/agents-constatateurs.md
          - Services de Santé: manuel/services-sante.md
          - Compagnies d'Assurance: manuel/compagnies-assurance.md
          - Agents de Validation: manuel/agents-validation.md
          - Administrateurs: manuel/administrateurs.md
          - Usagers (Grand Public): manuel/usagers.md
          - Morgue: manuel/morgue.md
          - Services de Secours: manuel/services-secours.md
          - Centre d'Analyse: manuel/centre-analyse.md
          - Agences de Voyage: manuel/agence-voyage.md
      - Référence Technique:
          - Codes d'Erreur: manuel/reference/codes-erreur.md
          - Glossaire: manuel/reference/glossaire.md
          - API Reference: manuel/reference/api-reference.md

  - 📊 Modules Fonctionnels:
      - Accueil: modules/index.md
      - Collecte de Données: modules/collecte-donnees.md
      - Validation: modules/validation-constats.md
      - Analyse & Reporting: modules/analyse-reporting.md
      - Cartographie: modules/cartographie-accidents.md
      - Module VAAR: modules/module-vaar.md
      - Statistiques: modules/statistiques-metriques.md
  
  - 🚀 Guides d'Implémentation:
      - Accueil: implementation/index.md
      - Installation: implementation/installation.md
      - Déploiement: implementation/deployment.md
      - Maintenance: implementation/maintenance.md
      - Sauvegarde: implementation/backup-procedures.md
  
  - 💻 Documentation Développeur:
      - Accueil: developer/index.md
      - Architecture: developer/architecture.md
      - Spécifications: developer/specifications.md
      - Sécurité: developer/security-plan.md
      - Tests: developer/testing-strategy.md
      - API: developer/api-reference.md
      - Setup Dev: developer/setup.md
      - Contribution: developer/contributing.md
  

# Markdown Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Plugins
plugins:
  - search:
      lang: fr
      separator: '[\s\-\.]+'

# Extra CSS
extra_css:
 - assets/css/dhis2.css

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ditros
    - icon: fontawesome/solid/envelope
      link: mailto:contact@ditros.org
  version:
    provider: mike
