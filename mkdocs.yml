site_name: ""
site_url: https://documentation-doser.readthedocs.io/
site_description: Documentation complète du système unifié de gestion des accidents de la route au Cameroun

extra:
  dhis2_languages:
    en: 'English'
    fr: 'Français'

theme:
  name: material
  custom_dir: docs/overrides
  language: fr
  logo: assets/logo.png
  favicon: assets/favicon.ico
  features:
    - navigation.menutabs
    - navigation.top
    - navigation.tabs
    - navigation.indexes
    #- navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - toc.integration
    ##- navigation.tabs.integrate
    - navigation.instant
    ##- navigation.tracking
    ##- navigation.footer
    - navigation.prune
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - content.action.edit
  
  palette:
    - scheme: default
      primary: blue
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Mode sombre
    - scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-night
        name: Mode clair

language: 'fr'
font: false
filter:
    versions:
      - 'master'
      - '2.42'
      - '2.41'
      - '2.40'
      - '2.39'
    categories:
      - Développement & Technique
     
nav:
  - Accueil: index.md

  - " Développement & Technique":
      - " Spécifications Fonctionnelles": developpement/specifications-fonctionnelles.md
      - " Architecture Technique": developpement/architecture-technique.md
      - " Plan de Sécurité": developpement/plan-securite.md

  - " Déploiement & Administration":
      - " Guide d'Installation": deployment/guide-installation.md
      - " Guide de l'Administrateur": deployment/guide-administrateur.md
      - " Procédures de Sauvegarde": deployment/procedures-sauvegarde.md

  - " 👥 Guides par Acteur":
      - "👮 Agents Constatateurs": acteurs/agents-constatateurs.md
      - "🔍 Agents de Validation": acteurs/agents-validation.md
      - "👮 Forces de l'Ordre": acteurs/forces-ordre.md
      - "🏥 Services de Santé": acteurs/services-sante.md
      - "🏢 Compagnies d'Assurance": acteurs/assurances.md
      - "👮 Administrateurs": acteurs/administrateurs.md

  - " Modules Fonctionnels":
      - "Collecte de Données": modules/collecte-donnees.md
      - "Validation des Constats": modules/validation-constats.md
      - "Analyse et Reporting": modules/analyse-reporting.md
      - "Cartographie des Accidents": modules/cartographie-accidents.md
      - "Gestion des Utilisateurs": modules/gestion-utilisateurs.md
      - "Notifications et Alertes": modules/notifications-alertes.md

  - " 💻 Pour les Développeurs":
      - " 🚀 Environnement de Dev": developpers/setup.md
      - " 📚 Référence API": developpers/api-reference.md
      - " 🤝 Guide de Contribution": developpers/contributing.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html

plugins:
  - search

extra_css:
  ##- assets/css/custom.css
 - assets/css/dhis2.css